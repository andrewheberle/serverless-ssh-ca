name: Client end-to-end tests

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_call:

# only superseded pull request runs are cancelled, so runs on main and those
# called from the release workflow always complete
concurrency:
  group: client-e2e-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  client-e2e:
    name: client (${{ matrix.client-ref }})
    strategy:
      fail-fast: false
      matrix:
        client-ref: [main, latest]
    uses: andrewheberle/ssh-ca-client/.github/workflows/e2e.yml@main
    with:
      ca-ref: ${{ github.sha }}
      client-ref: ${{ matrix.client-ref }}

  # Single required check for branch protection, so the ruleset doesn't need
  # updating when jobs or matrix entries change. Runs even when a needed job
  # fails, as a skipped required check counts as passing
  client-e2e-ok:
    name: client-e2e-ok
    runs-on: ubuntu-latest
    needs: [client-e2e]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Check all client end-to-end tests passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
