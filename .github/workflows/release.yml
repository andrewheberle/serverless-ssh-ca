name: Release

# The tag and a draft GitHub release are created by release-please when the
# release PR is merged. The release is a draft as an immutable release can't
# have assets added once published, so this workflow attaches the assets and
# then publishes it. This workflow name is registered as the trusted publisher
# on npm, so don't rename it
on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # npm's trusted publisher is bound to this environment, whose protection
    # rules gate every publish
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the history of main, to check the tagged commit is on it
          fetch-depth: 0
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main, so is not released"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check tag matches package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in package.json packages/core/package.json packages/testing/package.json; do
            actual="$(node -p "require('./$pkg').version")"
            if [ "$actual" != "$version" ]; then
              echo "$pkg has version $actual but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - run: npm ci
      - run: npm run build
      - run: npm run schema
      - name: Check OpenAPI schema is up to date
        run: git diff --exit-code -- packages/core/openapi.json
      - uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: sbom.spdx.json
          sbom-path: sbom.spdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packages/core/openapi.json
      # each package is published in its own step, which skips a version
      # already on npm, so the workflow can be re-run to finish a release
      # that failed part way through
      - name: Publish core to npm
        run: .github/scripts/publish-once.sh packages/core --access public
      - name: Publish testing to npm
        run: .github/scripts/publish-once.sh packages/testing --access public
      # the assets are attached and the release published only once both
      # packages are on npm, so a published release always has both. A re-run
      # after the release was published skips both steps, but still fails if
      # an asset is missing, as a published release can't be changed
      - name: Check whether the release is a draft
        id: release
        run: echo "draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Add assets to GitHub release
        if: steps.release.outputs.draft == 'true'
        run: gh release upload "$GITHUB_REF_NAME" packages/core/openapi.json sbom.spdx.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      # a prerelease can't be marked as latest, as in ssh-ca-client
      - name: Publish release
        if: steps.release.outputs.draft == 'true'
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq .isPrerelease)" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Check the published release has its assets
        if: steps.release.outputs.draft != 'true'
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for asset in openapi.json sbom.spdx.json; do
            if ! grep -qxF "$asset" <<< "$assets"; then
              echo "::error::$GITHUB_REF_NAME was published without $asset, and a published release can't be changed, so release a new patch version"
              exit 1
            fi
          done
          echo "$GITHUB_REF_NAME is already published with its assets"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
