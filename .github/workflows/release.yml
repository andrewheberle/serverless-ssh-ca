name: Release

# The tag and GitHub release are created by release-please when the release
# PR is merged. This workflow name is registered as the trusted publisher on
# npm, so don't rename it
on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check tag matches package versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in package.json packages/core/package.json packages/testing/package.json; do
            actual="$(node -p "require('./$pkg').version")"
            if [ "$actual" != "$version" ]; then
              echo "$pkg has version $actual but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - run: npm ci
      - run: npm run build
      - run: npm run schema
      - name: Check OpenAPI schema is up to date
        run: git diff --exit-code -- packages/core/openapi.json
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: sbom.spdx.json
          sbom-path: sbom.spdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: packages/core/openapi.json
      - name: Publish to npm
        run: npm publish --workspace packages/core --workspace packages/testing --access public
      - name: Add assets to GitHub release
        run: gh release upload "$GITHUB_REF_NAME" packages/core/openapi.json sbom.spdx.json --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
