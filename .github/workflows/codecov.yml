name: Run tests and upload coverage

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - run: npm ci
      - run: npm run coverage
      - name: Upload results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: andrewheberle/serverless-ssh-ca

  # Single required check for branch protection, so the ruleset doesn't need
  # updating when jobs or matrix entries change. Runs even when a needed job
  # fails, as a skipped required check counts as passing
  tests-ok:
    name: tests-ok
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Check all test jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
