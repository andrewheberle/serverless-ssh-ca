name: Build

on:
  push:
    branches:
      - 'main'
  pull_request:

permissions: {}

jobs:
  worker:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run test:workers
      - run: npm run schema
      - name: Check OpenAPI schema is up to date
        run: |
          git diff --exit-code -- packages/core/openapi.json || (echo "OpenAPI schema is out of date. Run 'npm run schema' and commit the changes." && exit 1)

  # Checks openapi.json for breaking changes against the last release, so a
  # break is caught here even before a client release syncs the schema the
  # client end-to-end tests compare against. It fails on warnings as well as
  # errors. Approved breaking changes of either level are listed in
  # packages/core/.oasdiff-err-ignore, and .oasdiff.yaml raises changes that
  # oasdiff leaves at INFO but that break clients, such as renaming an
  # operation ID or changing a default, to errors. The action is pinned as in
  # ssh-ca-client's e2e.yml, so both run the same oasdiff. Specs are not
  # uploaded to oasdiff.com and no comment is posted
  openapi:
    name: openapi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get openapi.json from the last release
        id: base
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$tag" ]; then
            echo "no release tag found" >&2
            exit 1
          fi
          echo "Comparing with $tag"
          git show "$tag:packages/core/openapi.json" > _base-openapi.json
      - name: Check for breaking changes
        uses: oasdiff/oasdiff-action/breaking@14ca7009a63c417dfe27b7c44359c4bcccaf8eee # v0.2.1
        with:
          base: _base-openapi.json
          revision: packages/core/openapi.json
          config: packages/core/.oasdiff.yaml
          fail-on: WARN
          err-ignore: ${{ hashFiles('packages/core/.oasdiff-err-ignore') != '' && 'packages/core/.oasdiff-err-ignore' || '' }}
          warn-ignore: ${{ hashFiles('packages/core/.oasdiff-err-ignore') != '' && 'packages/core/.oasdiff-err-ignore' || '' }}
          review: 'false'
          github-token: ''

  # Single required check for branch protection, so the ruleset doesn't need
  # updating when jobs or matrix entries change. Runs even when a needed job
  # fails, as a skipped required check counts as passing
  build-ok:
    name: build-ok
    runs-on: ubuntu-latest
    needs: [worker, openapi]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Check all build jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
