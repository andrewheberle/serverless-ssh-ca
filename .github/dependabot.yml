# Dependabot replaces Renovate, whose npm manager can't find the locked
# version of a dependency that npm hoists out of a workspace, so it never
# proposed in-range updates or security fixes for the workspace packages
# (renovatebot/renovate discussion #47546).
#
# PRs are squash merged with the PR title as the commit message, so titles
# must be conventional commits. npm updates only change the lockfile, which
# isn't published, so they are chore(deps) and don't trigger a release.
version: 2
updates:
  - package-ecosystem: npm
    # The root package-lock.json covers every workspace
    directory: /
    schedule:
      interval: weekly
    # Never change package.json. core and testing publish their ranges, and
    # raising a minimum breaks consumers: core shares zod with chanfana, so a
    # zod range above the copy chanfana gets installs a second zod that
    # chanfana never extends with .openapi(). increase-if-necessary raises
    # minimums anyway (dependabot/dependabot-core#14798), so only the lockfile
    # is updated, and updates outside a range (majors) are made by hand.
    versioning-strategy: lockfile-only
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
